name: Android CI Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Force Node 24 runtime to resolve action runner deprecation warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ==========================================
      # 1. Repository Checkout & Environment Setup
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ==========================================
      # 2. Build Process (Release)
      # ==========================================
      # Decode Base64 keystore to file before build
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks

      # Changed: Use assembleRelease instead of assembleDebug
      - name: Build Release APK
        env:
          # Inject repository secret CUSTOM_TUNNEL_ID into Gradle build process
          CUSTOM_TUNNEL_ID: ${{ secrets.CUSTOM_TUNNEL_ID }}
          # Inject keystore credentials into Gradle build process
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Execute build using assembleRelease task
        run: gradle assembleRelease --stacktrace --parallel --build-cache --no-daemon

      # ==========================================
      # 3. Artifact Upload
      # ==========================================
      # Changed: Upload the signed release APK from the release outputs folder
      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: passkey-bridge-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7